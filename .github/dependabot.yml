version: 2
registries:
  github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket/matrikkel
    username: x-access-token
    password: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "daily"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    registries:
      - github-packages
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"