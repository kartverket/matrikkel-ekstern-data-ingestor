[versions]
kotlin = "2.4.0"
logback = "1.5.37"
mockk = "1.14.5"
junitVersion = "6.1.3"
assertk = "0.28.1"
kotlinxCoroutinesTest = "1.11.0"
heimdallCommon = "1.2026.09.23-06.21-1381522"

[libraries]
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }
ktorUtils = { module = "no.kartverket.heimdall.common:ktor-utils", version.ref = "heimdallCommon"}
kotlinUtils = { module = "no.kartverket.heimdall.common:kotlin-utils", version.ref = "heimdallCommon"}
tokenClient = { module = "no.kartverket.heimdall.common:token-client", version.ref = "heimdallCommon"}
micrometerPrometheus = { module = "io.micrometer:micrometer-registry-prometheus", version = "1.17.0" }
kafkaLight = { module = "no.kartverket.kafkalight:client", version = "2026.09.18-06.50-a8e4ad5"}
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
junitApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitVersion" }
junitEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitVersion" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

[bundles]
testEcosystem = [
    "logbackClassic",
    "mockk",
    "junitApi",
    "junitEngine",
    "assertk",
    "kotlinxCoroutinesTest",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
