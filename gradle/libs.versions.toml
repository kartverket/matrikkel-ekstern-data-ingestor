[versions]
kotlin = "2.4.20"
jacksonVersion = "2.22.2"
junitVersion = "6.1.3"
heimdallCommon = "1.2026.09.23-07.21-211005a"
ktorVersion = "3.6.0"

[libraries]
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.19" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version = "1.6.3" }
logstash = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }
common-ktorUtils = { module = "no.kartverket.heimdall.common:ktor-utils", version.ref = "heimdallCommon"}
common-kotlinUtils = { module = "no.kartverket.heimdall.common:kotlin-utils", version.ref = "heimdallCommon"}
common-tokenClient = { module = "no.kartverket.heimdall.common:token-client", version.ref = "heimdallCommon"}
common-featureFlags = { module = "no.kartverket.heimdall.common:feature-flags", version.ref = "heimdallCommon" }
kafkaLight-client = { module = "no.kartverket.kafkalight:client", version = "2026.09.18-06.50-a8e4ad5"}
micrometerPrometheus = { module = "io.micrometer:micrometer-registry-prometheus", version = "1.17.1" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
junitApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitVersion" }
junitEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitVersion" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version = "0.28.1" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.11.0" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.8.0" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktorVersion" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorVersion" }
ktorClientWebsockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktorVersion" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorVersion" }
jackson = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref="jacksonVersion" }
jacksonJSR310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref="jacksonVersion" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }


[bundles]
testEcosystem = [
    "logbackClassic",
    "mockk",
    "junitApi",
    "junitEngine",
    "assertk",
    "kotlinxCoroutinesTest",
]

kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]

ktorClientEcosystem = [
    "ktorClientCore",
    "ktorClientContentNegotiation",
    "ktorClientWebsockets",
    "ktorClientCio",
    "jackson",
    "jacksonJSR310"
]


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version = "7.25.0"}

